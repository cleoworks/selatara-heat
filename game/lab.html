<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SELATARA HEAT — Character Lab</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #23262c; font-family: sans-serif; }
  #ui { position: absolute; top: 10px; left: 10px; z-index: 5; background: rgba(12,14,18,0.82); color: #e8e6df;
        padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; max-width: 300px; }
  #ui select, #ui button { font-size: 13px; margin: 2px 2px 2px 0; }
  #info { position: absolute; left: 10px; bottom: 10px; z-index: 5; background: rgba(12,14,18,0.82); color: #ffd76a;
          padding: 6px 10px; border-radius: 6px; font-size: 13px; white-space: pre; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="ui">
  <div><b>CHARACTER LAB</b></div>
  <div>Archetype <select id="selArch"></select></div>
  <div>Animation <select id="selAnim"></select></div>
  <div>
    <button id="btnSheet">Contact sheet</button>
    <button id="btnCrowd">Crowd 30</button>
    <button id="btnSingle">Single</button>
  </div>
  <div style="opacity:.75">Drag to orbit, wheel to zoom.</div>
</div>
<div id="info">loading…</div>

<script src="./vendor/three.min.js"></script>
<script src="./src/characters/rig.js"></script>
<script src="./src/characters/factory.js"></script>
<script src="./src/characters/archetypes.js"></script>
<script src="./src/characters/animation.js"></script>
<script>
(function () {
  'use strict';
  var qs = {};
  location.search.slice(1).split('&').forEach(function (kv) {
    var p = kv.split('='); if (p[0]) qs[p[0]] = decodeURIComponent(p[1] || '');
  });

  // ---- Stage C: the archetype table is DATA now ---------------------------
  // game/src/characters/archetypes.js is the single source (story cast,
  // police, enemies, >=14 pedestrians). The lab only reads it — the
  // Iterasi 2 hard-coded presets that used to live here are gone.
  var ARCH = SH.ArchetypeList;
  // Animation dropdown: spec names -> clip names in CharAnim.
  var ANIMS = [
    { id: 'idle', clip: 'idle' }, { id: 'walk', clip: 'walk' }, { id: 'run', clip: 'run' },
    { id: 'aim', clip: 'aim_pistol' }, { id: 'shoot', clip: 'shoot_pistol' }, { id: 'hit', clip: 'hit_front' },
    { id: 'death', clip: 'death' }, { id: 'drive', clip: 'drive' }, { id: 'panic', clip: 'panic' },
    { id: 'hands_up', clip: 'hands_up' }
  ];
  function clipFor(id) {
    for (var i = 0; i < ANIMS.length; i++) if (ANIMS[i].id === id || ANIMS[i].clip === id) return ANIMS[i].clip;
    return id;
  }
  function archById(id) {
    for (var i = 0; i < ARCH.length; i++) if (ARCH[i].id === id) return ARCH[i];
    var n = parseInt(id, 10);
    if (!isNaN(n) && ARCH[n]) return ARCH[n];
    return ARCH[0];
  }

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x353a42);
  var camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.05, 300);

  scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x3a3428, 0.95));
  var key = new THREE.DirectionalLight(0xfff1dd, 1.6); key.position.set(3.5, 5, 4); scene.add(key);
  var rim = new THREE.DirectionalLight(0xbcd4ff, 0.7); rim.position.set(-4, 3, -3.5); scene.add(rim);
  var ground = new THREE.Mesh(new THREE.CircleGeometry(30, 40),
    new THREE.MeshStandardMaterial({ color: 0x4a4f57, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);
  var grid = new THREE.PolarGridHelper(6, 12, 6, 48, 0x666c76, 0x555b64);
  grid.position.y = 0.002; scene.add(grid);

  var stage = new THREE.Group(); scene.add(stage);
  var chars = [], ctls = [];

  function geoTris(g) { return g ? Math.round((g.index ? g.index.count : g.attributes.position.count) / 3) : 0; }
  // LOD0 triangle report per part (spec panel: tris per person + scene)
  function lod0Report(char) {
    var P = char.parts;
    var body = geoTris(P.body0.geometry), head = geoTris(P.head0.geometry), clothes = 0, hair = 0, deco = 0;
    for (var i = 0; i < P.clothes0.length; i++) clothes += geoTris(P.clothes0[i].geometry);
    if (char.hairMesh) hair += geoTris(char.hairMesh.geometry);
    if (char.hairSwingGroup) char.hairSwingGroup.traverse(function (o) { if (o.isMesh) hair += geoTris(o.geometry); });
    ['head', 'spine2', 'pelvis', 'neck', 'handL', 'handR'].forEach(function (n) {
      var b = char.bones[n]; if (!b) return;
      for (var q = 0; q < b.children.length; q++) {
        var ch = b.children[q];
        if (ch.isMesh && ch !== char.hairMesh) deco += geoTris(ch.geometry);
      }
    });
    return { body: body, head: head, clothes: clothes, hair: hair, deco: deco, total: body + head + clothes + hair + deco };
  }
  function sceneTris() {
    var t = 0; for (var i = 0; i < chars.length; i++) t += lod0Report(chars[i]).total;
    return t;
  }

  function place(char, x, z, ry) {
    char.group.position.set(x, 0, z); char.group.rotation.y = ry || 0;
    stage.add(char.group); chars.push(char);
    return char;
  }
  function addCtl(char, startClip) {
    var ctl = SH.CharAnim.create(char, { start: startClip || 'idle' });
    ctls.push(ctl); return ctl;
  }

  var mode = qs.mode || 'single';
  var infoLines = [];
  var bendAmt = 0;

  function frameSingle(char) {
    var H = char.params.H, j = SH.CharRig.joints(char.params);
    var headCY = j.headY + SH.CharRig.headDims(char.params).cy;
    var cam = qs.cam || 'front';
    if (cam === 'side') { camera.position.set(3.0, H * 0.55, 0.35); camera.lookAt(0, H * 0.50, 0); }
    else if (cam === 'back') { camera.position.set(-1.15, H * 0.60, -2.95); camera.lookAt(0, H * 0.52, 0); }
    else if (cam === 'face') { camera.position.set(0.30, headCY + 0.03, 0.92); camera.lookAt(0, headCY - 0.02, 0); }
    else if (cam === 'low') { camera.position.set(1.1, 0.45, 2.2); camera.lookAt(0, 0.55, 0); }
    else { camera.position.set(1.15, H * 0.60, 2.95); camera.lookAt(0, H * 0.52, 0); }
  }

  // Proportion grid: horizontal lines every ONE HEAD of height
  // (spec: verify proportions against head units in the lab).
  function addHeadGrid(char) {
    var p = char.params, hd = SH.CharRig.headDims(p);
    var headH = 2 * hd.r0 * hd.sy;
    var pts = [];
    for (var k = 1; k * headH < p.H + 0.01; k++) {
      var y = k * headH;
      pts.push(-0.95, y, -0.55, 0.95, y, -0.55);
      pts.push(-0.95, y, -0.55, -0.80, y, -0.55);
    }
    pts.push(-0.95, 0, -0.55, -0.95, p.H, -0.55);
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    var lines = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x8a929e, transparent: true, opacity: 0.55 }));
    stage.add(lines);
    return headH;
  }

  if (mode === 'sheet') {
    var view = qs.view || 'front';
    var sheetList = ARCH;
    if (qs.only) { // Stage C: subset sheets (e.g. the 4 police types)
      var want = qs.only.split(',');
      sheetList = ARCH.filter(function (a) { return want.indexOf(a.id) >= 0; });
    }
    var tot = 0, spacing = 0.62;
    sheetList.forEach(function (a, i) {
      var c = SH.CharFactory.create(a, 7 + i * 3);
      place(c, (i - (sheetList.length - 1) / 2) * spacing, 0, view === 'side' ? Math.PI / 2 : 0);
      var ctl = addCtl(c, a.idle || 'idle');
      var act = ctl.action(); if (act) act.time = (i * 0.53) % 3.6;
      tot += lod0Report(c).total;
    });
    // camera distance adapts to the row width (28 archetypes now);
    // the floor keeps a 4-archetype subset sheet full-body framed
    var halfW = (sheetList.length - 1) / 2 * spacing;
    camera.position.set(0, 1.02, Math.max(halfW / 0.612 + 1.2, 4.6)); camera.lookAt(0, 0.92, 0);
    infoLines.push('CONTACT SHEET (' + view + ') — ' + sheetList.length + ' archetypes');
    infoLines.push('scene tris LOD0=' + tot);
  } else if (mode === 'crowd') {
    var starts = ['idle', 'idle_phone', 'idle', 'idle_lean', 'talk', 'idle_smoke', 'wave', 'idle'];
    var crowdN = parseInt(qs.n || '30', 10);
    // Stage C: the crowd cycles the NON-STORY archetypes (police,
    // enemies, pedestrians) — story cast are unique people and must
    // never appear twice; everyone else varies by seed.
    var pool = ARCH.filter(function (a) { return a.kind !== 'story'; });
    var totC = 0;
    for (var ci = 0; ci < crowdN; ci++) {
      var a2 = pool[ci % pool.length];
      var cc = SH.CharFactory.create(a2, 100 + ci * 7);
      var col = ci % 6, row = Math.floor(ci / 6);
      var jx = Math.sin(ci * 37.7) * 0.22, jr = Math.sin(ci * 13.3) * 0.55;
      place(cc, (col - 2.5) * 1.45 + jx, -1.4 - row * 1.45, jr);
      var ctl2 = addCtl(cc, a2.idle || starts[ci % starts.length]);
      var act2 = ctl2.action(); if (act2) act2.time = (ci * 0.41) % 3.0;
      totC += lod0Report(cc).total;
    }
    camera.position.set(0, 1.8, 4.8); camera.lookAt(0, 0.95, -2.2);
    infoLines.push('CROWD ' + crowdN + ' — game distance');
    infoLines.push('scene tris LOD0=' + totC);
  } else {
    var arch = qs.arch ? archById(qs.arch) : (qs.test != null ? ARCH[parseInt(qs.test, 10) % ARCH.length] : ARCH[0]);
    var c = SH.CharFactory.create(arch, parseInt(qs.seed || '7', 10));
    place(c, 0, 0, parseFloat(qs.ry || '0'));
    var startClip = clipFor(qs.anim || 'idle');
    addCtl(c, startClip);
    var rep = lod0Report(c);
    var headH = addHeadGrid(c);
    infoLines.push(arch.id + '  seed=' + (qs.seed || '7') + '  anim=' + startClip);
    infoLines.push('LOD0 tris=' + rep.total + '  body=' + rep.body + ' head=' + rep.head + ' hair=' + rep.hair + ' clothes=' + rep.clothes + ' deco=' + rep.deco);
    infoLines.push('H=' + c.params.H.toFixed(2) + ' m  head=' + headH.toFixed(3) + ' m  scene tris=' + rep.total);
    frameSingle(c);
  }

  // ---- dropdowns + buttons -------------------------------------------------
  var selArch = document.getElementById('selArch');
  ARCH.forEach(function (a) {
    var o = document.createElement('option'); o.value = a.id; o.textContent = a.label; selArch.appendChild(o);
  });
  selArch.value = (archById(qs.arch || 'raka')).id;
  var selAnim = document.getElementById('selAnim');
  ANIMS.forEach(function (a) {
    var o = document.createElement('option'); o.value = a.id; o.textContent = a.id; selAnim.appendChild(o);
  });
  selAnim.value = qs.anim || 'idle';
  function nav(params) {
    var parts = [];
    for (var k in params) parts.push(k + '=' + encodeURIComponent(params[k]));
    location.search = '?' + parts.join('&');
  }
  selArch.addEventListener('change', function () { nav({ mode: 'single', arch: selArch.value, anim: selAnim.value, seed: qs.seed || '7' }); });
  selAnim.addEventListener('change', function () { nav({ mode: 'single', arch: selArch.value, anim: selAnim.value, seed: qs.seed || '7' }); });
  document.getElementById('btnSheet').addEventListener('click', function () {
    nav({ mode: 'sheet', view: (mode === 'sheet' && qs.view !== 'side') ? 'side' : 'front' });
  });
  document.getElementById('btnCrowd').addEventListener('click', function () { nav({ mode: 'crowd' }); });
  document.getElementById('btnSingle').addEventListener('click', function () {
    nav({ mode: 'single', arch: selArch.value, anim: selAnim.value, seed: qs.seed || '7' });
  });

  var info = document.getElementById('info');
  var lastT = performance.now();
  function tick() {
    requestAnimationFrame(tick);
    var now = performance.now();
    var dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    if (qs.spin) stage.rotation.y += 0.0035;
    for (var i = 0; i < ctls.length; i++) ctls[i].update(window.__freezeAnim ? 0 : dt);
    if (bendAmt && chars.length) {
      // forward bend for the waist-junction check, applied AFTER
      // the mixers so it holds for screenshots
      for (var bi = 0; bi < chars.length; bi++) {
        var B = chars[bi].bones;
        if (B.spine1) B.spine1.rotateX(0.48 * bendAmt);
        if (B.spine2) B.spine2.rotateX(0.38 * bendAmt);
        if (B.neck) B.neck.rotateX(-0.20 * bendAmt);
        if (B.head) B.head.rotateX(-0.28 * bendAmt);
      }
    }
    SH.CharFactory.update(camera, scene);
    renderer.render(scene, camera);
    info.textContent = infoLines.join('\n') +
      '\ndrawCalls=' + renderer.info.render.calls + ' trisFrame=' + renderer.info.render.triangles;
  }
  tick();

  // minimal orbit for humans
  var drag = null;
  addEventListener('pointerdown', function (e) { drag = [e.clientX, e.clientY]; });
  addEventListener('pointermove', function (e) {
    if (!drag) return;
    stage.rotation.y += (e.clientX - drag[0]) * 0.008;
    drag = [e.clientX, e.clientY];
  });
  addEventListener('pointerup', function () { drag = null; });
  addEventListener('wheel', function (e) {
    camera.position.multiplyScalar(e.deltaY > 0 ? 1.08 : 0.93);
  });

  window.LAB = { scene: scene, camera: camera, stage: stage, chars: chars, ctls: ctls,
    ARCH: ARCH, ANIMS: ANIMS, lod0Report: lod0Report,
    ctl: ctls[0] || null,
    // deterministic pose for screenshots: freeze the current action at t
    setPhase: function (t) {
      window.__freezeAnim = true;
      var ctl = ctls[0];
      if (ctl) {
        var a = ctl.action();
        if (a) { a.time = t; }
        ctl.mixer.update(0);
        ctl.update(0);
      }
    },
    playAnim: function (name) { var ctl = ctls[0]; if (ctl) ctl.play(clipFor(name), 0, true); },
    setBend: function (v) { bendAmt = v; } };
})();
</script>
</body>
</html>
