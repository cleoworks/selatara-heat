<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SELATARA HEAT — an original open-world crime game</title>
<style>
  :root {
    --ink: #f4efe6; --panel: rgba(10, 12, 20, .55); --line: rgba(255, 255, 255, .35);
    --neon-pink: #ff4fa3; --neon-cyan: #37e0ff; --neon-yellow: #ffd23f; --danger: #e83a3a;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1030; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 3;
    background: radial-gradient(ellipse at center, transparent 58%, rgba(5, 4, 16, .42) 100%); }
  #damage-flash { position: fixed; inset: 0; pointer-events: none; z-index: 4; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(200, 20, 30, .5) 100%); }
  #loading { position: fixed; inset: 0; z-index: 40; background: #0b1030; display: flex;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  #loading .logo { font-size: clamp(30px, 6vmin, 58px); font-weight: 800; letter-spacing: .14em; }
  #loading .logo span { color: var(--neon-pink); }
  #loading .bar { width: min(420px, 70vw); height: 6px; background: rgba(255,255,255,.15); border-radius: 3px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 40%; background: var(--neon-cyan); border-radius: 3px; transition: width .3s; }
  #loading p { opacity: .75; letter-spacing: .22em; font-size: 12px; margin: 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="game" aria-label="Selatara Heat: open-world crime game"></canvas>
<div id="vignette"></div>
<div id="damage-flash"></div>

<div id="loading">
  <div class="logo">SELATARA <span>HEAT</span></div>
  <div class="bar"><i id="load-fill"></i></div>
  <p>MEMUAT KOTA • LOADING THE CITY</p>
</div>

<script src="./vendor/three.min.js"></script>
<script src="./src/config.js"></script>
<script src="./src/input.js"></script>
<script src="./src/audio.js"></script>
<script src="./src/world.js"></script>
<script src="./src/roads.js"></script>
<script src="./src/buildings.js"></script>
<script src="./src/player.js"></script>
<script src="./src/shots.js"></script>
<script src="./src/main.js"></script>
</body>
</html>
